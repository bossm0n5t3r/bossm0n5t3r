# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format
# Manage dependency, plugin, and JDK toolchain versions here.
# Kotlin Test follows the Kotlin plugin; JUnit Platform follows JUnit's BOM.
# KotlinLang formatting: ./gradlew :app:ktfmtFormat (apply), :app:ktfmtCheck (verify).

[versions]
jdk = "25"
kotlin = "2.4.10"
junit-jupiter-engine = "6.1.3"
ktfmt = "0.27.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmt" }
