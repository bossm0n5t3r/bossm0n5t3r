name: Setup GitHub Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - "master"

concurrency:
  group: setup-github-profile
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Configure Git
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ vars.COMMITTER_EMAIL }}"

      - name: Compute commit timestamp
        id: commit_time
        run: uv run --frozen python scripts/compute_commit_timestamp.py

      - name: Generate metrics
        if: false # 비활성화됨 — 재사용 시 이 줄 제거
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.FOR_GITHUB_ACTIONS }}
          output_action: none
          filename: github-metrics.svg

          user: ${{ github.repository_owner }}
          template: classic
          base: header
          config_timezone: Asia/Seoul
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes

      - name: Copy metrics to publish directory
        if: false # 비활성화됨 — 재사용 시 이 줄 제거
        run: |
          mkdir -p dist
          sudo cp /metrics_renders/github-metrics.svg \
            dist/github-metrics.svg

      - name: Update blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          enable_keepalive: false
          feed_list: "https://blog.m0n5t3r.com/index.xml"
          skip_commit: true

      - name: Commit blog posts
        env:
          GIT_AUTHOR_DATE: ${{ steps.commit_time.outputs.value }}
          GIT_COMMITTER_DATE: ${{ steps.commit_time.outputs.value }}
        run: |
          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "Updated with the latest blog posts"
            git push origin HEAD:master
          fi

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish generated assets
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
